name: Build Zarro Comic Keyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZarroComicKeyboard/**"
      - ".github/workflows/build-zarro-keyboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ZarroComicKeyboard
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZarroComicKeyboard-debug-apk
          path: ZarroComicKeyboard/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
